plugins {
	id 'java'
	id 'maven-publish'
	id 'net.neoforged.moddev.legacyforge' version '2.0.143'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-forge-${project.minecraft_version}"
}

legacyForge {
	version = project.forge_version

	validateAccessTransformers = true

	runs {
		client {
			client()
		}
		server {
			server()
		}
	}

	mods {
		culturalcreators {
			sourceSet sourceSets.main
		}
	}
}

processResources {
	inputs.property "version", project.version
	inputs.property "forge_version_range", project.forge_version_range

	filesMatching("META-INF/mods.toml") {
		expand "version": project.version,
				"forge_version_range": project.forge_version_range
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
}
